<!doctype html>
<html lang="es">
  <style>
    .magma-bg-container {
      position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none; 
    }
    
    /* Círculos sólidos puros. El blur hace toda la magia del difuminado */
    .magma-blob {
      position: absolute; 
      border-radius: 50%;
      filter: blur(120px);
      -webkit-filter: blur(120px); /* Obligatorio para Safari */
    }
    
    /* Mismos tamaños y colores del App.tsx */
    .blob-red {
      width: 800px; height: 800px;
      background-color: rgba(202, 17, 17, 0.25);
      top: -200px; left: -200px;
      animation: floatRed 25s ease-in-out infinite;
    }
    
    .blob-amber {
      width: 600px; height: 600px;
      background-color: rgba(206, 141, 37, 0.25);
      bottom: -100px; right: -100px;
      animation: floatAmber 30s ease-in-out infinite;
    }
    
    /* Animaciones 2D planas. (Sin "translate3d" para no romper el motor de Safari) */
    @keyframes floatRed {
      0%, 100% { transform: translate(0px, 0px) scale(1) rotate(0deg); }
      25% { transform: translate(150px, -100px) scale(1.4) rotate(45deg); }
      50% { transform: translate(-50px, 50px) scale(0.8) rotate(-45deg); }
      75% { transform: translate(100px, 150px) scale(1.2) rotate(20deg); }
    }
    
    @keyframes floatAmber {
      0%, 100% { transform: translate(0px, 0px) scale(1) rotate(0deg); }
      33% { transform: translate(-100px, 150px) scale(1.2) rotate(-30deg); }
      66% { transform: translate(100px, -50px) scale(0.9) rotate(30deg); }
    }
  </style>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MAGMA — La constancia crea fuerza</title>
  <meta name="description" content="Entrenamiento vivo y medible para equipos comerciales.">
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <link rel="stylesheet" href="styles.css?v=12">
</head>

<body>
  <div class="magma-bg-container">
    <div class="magma-blob blob-red"></div>
    <div class="magma-blob blob-amber"></div>
  </div>
  <div class="custom-cursor"></div>
  <div class="cursor-follower"></div>

  <div class="mac-dock-wrapper">
    <nav class="mac-dock">
      
      <a href="#inicio" class="dock-item logo-dock-item" data-tooltip="Inicio">
        <img src="assets/isologo.svg" alt="MAGMA" class="dock-logo">
        <svg class="dock-flame" viewBox="0 0 24 24">
          <path d="M12 2c0 0-5 7-5 11.5a5.5 5.5 0 0 0 11 0C18 9 12 2 12 2zM12 20a3.5 3.5 0 0 1-3.5-3.5c0-2 1.5-4.5 3.5-6.5 2 2 3.5 4.5 3.5 6.5A3.5 3.5 0 0 1 12 20z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </a>

      <a href="#metodologia" class="dock-item" data-tooltip="Solución">
        <svg viewBox="0 0 24 24">
          <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
        </svg>
      </a>

      <a href="#casos" class="dock-item" data-tooltip="Éxito">
        <svg viewBox="0 0 24 24">
          <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
        </svg>
      </a>

      <a href="#form" class="dock-item primary magnetic-btn" data-tooltip="Piloto">Activar</a>
      
    </nav>
  </div>

  <main id="main-content">
    <div id="inicio"></div>
    
<section class="cinematic-hero" id="inicio">
      
      <video id="magmaHeroVideo" autoplay muted loop playsinline webkit-playsinline class="hero-video-bg">
        <source src="assets/Teaser.mp4" type="video/mp4">
      </video>
      
      <div class="hero-overlay"></div>

      <div class="hero-content">
        <div class="reveal">
          
          <div class="mask-line">
            <span class="hero-kicker">Somos el futuro del aprendizaje de las empresas</span>
          </div>
          
          <h1 class="hero-title mask-title">
            <span class="mask-line"><span>Equipos</span></span>
            <span class="mask-line"><span>Potenciados</span></span>
            <span class="mask-line"><span>Por <span style="color: var(--magma-amber);">Magma</span></span></span>
          </h1>
          
          <div class="mask-line" style="transition-delay: 0.4s;">
            <p class="hero-subtitle">La constancia crea la fuerza</p>
          </div>

          <div class="mask-line" style="transition-delay: 0.6s; margin-top: 40px;">
            <span><a href="#form" class="btn primary magnetic-btn">Iniciar Protocolo</a></span>
          </div>

        </div>
      </div>
      
    </section>

    <section class="container metrics-section">
      <div class="metrics-grid">
        <div class="evo-metric-card reveal">
          <div class="evo-title">Aplicación Práctica (<24h)</div>
          <div class="evo-bar-container"><div class="evo-bar-fill" data-end="92"></div></div>
          <div class="evo-stats">
            <div class="evo-before">Tradicional: <strong>12%</strong></div>
            <div class="evo-after"><span class="count" data-start="12" data-target="92">12</span><span>%</span></div>
          </div>
        </div>

        <div class="evo-metric-card reveal" style="transition-delay: 0.1s;">
          <div class="evo-title">Engagement Promedio</div>
          <div class="evo-bar-container"><div class="evo-bar-fill" data-end="89"></div></div>
          <div class="evo-stats">
            <div class="evo-before">Mercado Actual: <strong>15%</strong></div>
            <div class="evo-after"><span class="count" data-start="15" data-target="89">15</span><span>%</span></div>
          </div>
        </div>

        <div class="evo-metric-card reveal" style="transition-delay: 0.2s;">
          <div class="evo-title">Retención del Conocimiento</div>
          <div class="evo-bar-container"><div class="evo-bar-fill" data-end="86"></div></div>
          <div class="evo-stats">
            <div class="evo-before">A 90 días: <strong>21%</strong></div>
            <div class="evo-after"><span class="count" data-start="21" data-target="86">21</span><span>%</span></div>
          </div>
        </div>
      </div>
    </section>

    <div style="height: 100px;"></div>
  </main>

  <script src="script.js"></script>
</body>
</html>
